<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAVI VISUALS — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#eee;font-family:Arial,sans-serif}.wrap{width:min(1100px,92%);margin:auto}header{border-bottom:1px solid #292929;padding:20px 0}.top{display:flex;justify-content:space-between;align-items:center}.logo{letter-spacing:.2em;font-weight:bold}.logo i{color:#d5bd91;font-style:normal}a{color:#d5bd91;text-decoration:none}.tabs{display:flex;gap:8px;margin:30px 0}.tabs button{background:#151515;color:#bbb;border:1px solid #292929;padding:11px 16px;cursor:pointer}.tabs button.active{color:#111;background:#d5bd91}.panel{background:#101010;border:1px solid #242424;padding:25px;margin-bottom:20px}.panel h2{margin-top:0;font-weight:500}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.item{border:1px solid #282828;background:#0b0b0b}.item img{width:100%;height:190px;object-fit:cover;display:block}.item div{padding:12px}.small{color:#888;font-size:12px}.delete{margin-top:8px;background:transparent;border:1px solid #633;color:#e99;padding:7px 10px;cursor:pointer}.upload{display:grid;gap:12px;max-width:600px}input,select{padding:13px;background:#080808;color:#eee;border:1px solid #292929}.primary{background:#eee;color:#111;border:0;padding:13px;font-weight:bold;cursor:pointer}.enquiry{border-top:1px solid #292929;padding:16px 0}.enquiry:first-child{border-top:0}.badge{display:inline-block;border:1px solid #d5bd91;color:#d5bd91;padding:4px 8px;font-size:11px;margin-left:6px}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{gap:15px;align-items:flex-start}}
</style></head><body>
<header><div class="wrap top"><div class="logo">KAVI <i>VISUALS</i> · ADMIN</div><a href="index.html">← View website</a></div></header>
<main class="wrap"><div class="tabs"><button class="active" data-tab="photos">Manage Photos</button><button data-tab="enquiries">Enquiries</button></div>
<section class="panel" id="photos"><h2>Upload / manage works</h2><p class="small">This local prototype stores photos in your browser. For a live website, connect this to cloud storage/database.</p>
<div class="upload"><input id="file" type="file" accept="image/*"><select id="cat"><option value="wedding">Wedding</option><option value="portrait">Portrait</option><option value="street">Street</option><option value="nature">Nature</option></select><input id="title" placeholder="Photo title"><button class="primary" id="add">Add photo</button></div><hr style="border-color:#222;margin:25px 0"><div class="grid" id="photosGrid"></div></section>
<section class="panel" id="enquiries" style="display:none"><h2>Client enquiries</h2><div id="eq"></div></section>
</main>
<script>
const defaults=[
['wedding','Wedding story','https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=1000&q=85'],['portrait','Portrait study','https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=1000&q=85'],['street','City after rain','https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=1000&q=85'],['nature','Into the wild','https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1000&q=85']];
function photos(){return JSON.parse(localStorage.getItem('kaviPhotos')||'null')||defaults}
function save(p){localStorage.setItem('kaviPhotos',JSON.stringify(p))}
function draw(){let p=photos();document.getElementById('photosGrid').innerHTML=p.map((x,i)=>`<div class="item"><img src="${x[2]}"><div><b>${x[1]}</b><div class="small">${x[0]}</div><button class="delete" onclick="del(${i})">Delete</button></div></div>`).join('')}
function del(i){let p=photos();p.splice(i,1);save(p);draw()}
document.getElementById('add').onclick=()=>{let f=document.getElementById('file').files[0];if(!f){alert('Choose a photo first');return}let r=new FileReader();r.onload=()=>{let p=photos();p.unshift([document.getElementById('cat').value,document.getElementById('title').value||'KAVI VISUALS',r.result]);save(p);draw();document.getElementById('file').value='';document.getElementById('title').value=''};r.readAsDataURL(f)};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('photos').style.display=b.dataset.tab==='photos'?'block':'none';document.getElementById('enquiries').style.display=b.dataset.tab==='enquiries'?'block':'none';if(b.dataset.tab==='enquiries')drawEq()});
function drawEq(){let q=JSON.parse(localStorage.getItem('kaviEnquiries')||'[]');document.getElementById('eq').innerHTML=q.length?q.map(x=>`<div class="enquiry"><b>${x.name}</b><span class="badge">${x.purpose}</span><div class="small">${x.email} · ${x.phone||'No phone'} · ${x.created}</div><p>${x.message||''}</p><div class="small">${x.location||'No location'} ${x.date?'· '+x.date:''}</div></div>`).join(''):'<p class="small">No enquiries yet.</p>'}
draw();
</script></body></html>
